# Local development with live reload (bind-mounted sources + watch).
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up sql api web
#
# Or API/SQL in Docker and UI on the host:
#   docker compose up -d sql api
#   cd frontend/care-home-web && npm start

name: carehome

services:
  api:
    build:
      context: .
      dockerfile: backend/CareHome.Api/Dockerfile.dev
    volumes:
      - ./backend/CareHome.Api:/src/CareHome.Api
      - carehome-api-nuget:/root/.nuget/packages
    healthcheck:
      start_period: 120s

  web:
    build:
      context: .
      dockerfile: frontend/care-home-web/Dockerfile
    volumes:
      - ./frontend/care-home-web:/app
      - carehome-web-node-modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    command:
      [
        "npx",
        "ng",
        "serve",
        "--host",
        "0.0.0.0",
        "--port",
        "4200",
        "--poll",
        "2000",
        "--proxy-config",
        "proxy.conf.docker.json",
      ]

volumes:
  carehome-web-node-modules:
  carehome-api-nuget:

# Shared build, test, and migration checks for CI and deployment pipelines.
name: Quality gates

on:
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: CareHome_CI_Test_Passw0rd!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P CareHome_CI_Test_Passw0rd! -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      CAREHOME_TEST_SQL: Server=localhost,1433;Database=CareHome_CI;User Id=sa;Password=CareHome_CI_Test_Passw0rd!;TrustServerCertificate=True;MultipleActiveResultSets=True
      ConnectionStrings__DefaultConnection: Server=localhost,1433;Database=CareHome_CI;User Id=sa;Password=CareHome_CI_Test_Passw0rd!;TrustServerCertificate=True;MultipleActiveResultSets=True

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore CareHome.Api.Tests/CareHome.Api.Tests.csproj

      - name: Build
        run: dotnet build CareHome.Api.Tests/CareHome.Api.Tests.csproj --configuration Release --no-restore

      - name: EF migrations model check
        run: |
          dotnet tool install -g dotnet-ef --version 10.0.11
          dotnet ef migrations has-pending-model-changes \
            --project backend/CareHome.Data/CareHome.Data.csproj \
            --startup-project backend/CareHome.Api/CareHome.Api.csproj

      - name: Verify production migration entrypoint
        run: dotnet run --project backend/CareHome.Api/CareHome.Api.csproj -c Release --no-build -- --apply-migrations

      - name: Test
        run: dotnet test CareHome.Api.Tests/CareHome.Api.Tests.csproj --configuration Release --no-build --verbosity normal

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/care-home-web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/care-home-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test -- --watch=false

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build production Docker image
        run: docker build -f backend/CareHome.Api/Dockerfile.prod -t carehome:ci .

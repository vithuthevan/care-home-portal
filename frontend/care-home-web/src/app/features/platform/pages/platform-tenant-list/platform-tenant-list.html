<div class="page">
  <app-page-header
    title="Organisations"
    subtitle="Platform administration for purchasing organisations."
  >
    <a mat-flat-button color="primary" routerLink="/platform/tenants/new">Add organisation</a>
  </app-page-header>
  <app-api-error [message]="errorMessage()" />
  <div class="table-container">
    <table class="data-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Trading name</th>
          <th>Email</th>
          <th class="col-status">Status</th>
          <th class="col-actions">Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (tenant of tenants(); track tenant.id) {
          <tr [class.inactive-row]="!tenant.isActive">
            <td class="font-medium">{{ tenant.name }}</td>
            <td>{{ tenant.tradingName || '—' }}</td>
            <td>{{ tenant.email || '—' }}</td>
            <td class="col-status"><app-status-badge [value]="tenant.isActive ? 'Active' : 'Inactive'" /></td>
            <td class="actions-cell col-actions">
              <app-icon-action
                icon="edit"
                ariaLabel="Edit organisation"
                [routerLink]="['/platform/tenants', tenant.id]"
              />
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>

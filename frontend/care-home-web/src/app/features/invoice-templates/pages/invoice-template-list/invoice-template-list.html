<div class="page">
  <app-page-header
    title="Invoice Templates"
    subtitle="Most specific matching template is used at generation time."
  >
    @if (auth.canWrite()) {
      <a mat-flat-button color="primary" routerLink="/invoice-templates/new">Add template</a>
    }
  </app-page-header>
  <app-api-error [message]="errorMessage()" />

  <div class="table-container panel panel--flat">
    <table class="data-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Category</th>
          <th>Authority</th>
          <th>Home</th>
          <th class="col-status">Status</th>
        </tr>
      </thead>
      <tbody>
        @for (item of items(); track item.id) {
          <tr>
            <td class="font-medium">{{ item.name }}</td>
            <td>{{ item.invoiceCategoryName }}</td>
            <td>{{ item.fundingAuthorityName || 'Any' }}</td>
            <td>{{ item.careHomeName || 'Any' }}</td>
            <td class="col-status"><app-status-badge [value]="item.isActive ? 'Active' : 'Inactive'" /></td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>

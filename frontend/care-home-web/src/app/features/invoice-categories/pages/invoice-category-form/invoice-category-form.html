<div class="page page--narrow">
  <app-page-header [title]="isEditMode ? 'Edit Invoice Category' : 'Add Invoice Category'" />
  <app-api-error [message]="errorMessage()" />
  @if (isLoading()) {
    <app-loading-state label="Loading invoice category..." />
  }
  @if (!isLoading()) {
    <form [formGroup]="form" (ngSubmit)="save()" class="panel max-w-3xl">
      <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Code</mat-label>
          <input matInput formControlName="code" required />
          @if (form.controls.code.touched && form.controls.code.hasError('required')) {
            <mat-error>Code is required.</mat-error>
          }
        </mat-form-field>
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" required />
          @if (form.controls.name.touched && form.controls.name.hasError('required')) {
            <mat-error>Name is required.</mat-error>
          }
        </mat-form-field>
        <mat-form-field appearance="outline" class="w-full md:col-span-2">
          <mat-label>Description</mat-label>
          <textarea matInput rows="3" formControlName="description"></textarea>
        </mat-form-field>
      </div>
      @if (isEditMode) {
        <mat-checkbox formControlName="isActive">Active</mat-checkbox>
      }
      <div class="mt-4 flex flex-wrap gap-2">
        <a mat-stroked-button routerLink="/invoice-categories">Cancel</a>
        <button
          mat-flat-button
          color="primary"
          type="submit"
          [disabled]="isSaving() || !auth.canWrite()"
        >
          @if (isSaving()) {
            Saving...
          } @else {
            Save
          }
        </button>
      </div>
    </form>
  }
</div>
